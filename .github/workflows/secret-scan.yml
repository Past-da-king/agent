name: Secret scan
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks
      - name: Scan this branch's commits
        run: ./gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="origin/main..HEAD"
